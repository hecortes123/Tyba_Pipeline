name: "tyba"
version: "1.0.0"
config-version: 2

profile: "tyba"

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

# La capa dbt vive ENCIMA de `core` (poblado por el motor CDC/SCD2 en Python).
# dbt trata core.* como SOURCES, construye los marts de analítica y ejecuta
# los tests declarativos + singulares que validan las invariantes del SCD2.
models:
  tyba:
    marts:
      +materialized: view
